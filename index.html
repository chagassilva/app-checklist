<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Controle de viagens</title>

    <meta name="theme-color" content="#1B263B" />
    <link rel="manifest" href="manifest.json" />

    <link
      Simpson
      apple-touch-icon
      href="https://ui-avatars.com/api/?name=TLD&background=F26419&color=1B263B&size=512&bold=true"
    />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #edf2f4;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://script.google.com/macros/s/AKfycbzUkaoSTvbk61D_4mABHDu2mLjL77JkRj7RDdmS_G0ukib4Q-LW9VgwsW5fzD9tcAsHPg/exec"
      allow="camera; microphone; fullscreen"
    >
    </iframe>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          // O '?v=7' força o navegador a baixar o sw.js novo
          navigator.serviceWorker.register("sw.js?v=7").then((reg) => {
            console.log("PWA: Monitorando atualizações...");

            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === "installed") {
                  if (navigator.serviceWorker.controller) {
                    // Nova versão detectada! Recarrega para aplicar.
                    console.log("Nova versão encontrada! Atualizando...");
                    window.location.reload();
                  }
                }
              };
            };
          });
        });
      }
    </script>
  </body>
</html>
